<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f8eee5">
<title>Meu Rosário — Terço</title>
<style>
:root{
  --bg:#f8eee5;
  --ink:#9b4d2f;
  --blue:#75a9c9;
  --blue2:#4e8db7;
  --gold:#d7a12f;
  --bead:#a65a38;
  --done:#6ca9ce;
  --line:#e8cdbd;
  --white:#fffaf6;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  color:var(--ink);
}
.app{height:100%;width:100%;display:flex;flex-direction:column;max-width:760px;margin:auto}
header{
  height:54px;flex:0 0 auto;display:flex;align-items:center;
  justify-content:space-between;padding:4px 14px 0;
}
.brand{font-family:Georgia,serif;font-size:25px;font-weight:700;letter-spacing:-.3px}
.header-actions{display:flex;gap:7px}
.iconbtn{
  width:40px;height:40px;border:1px solid var(--line);border-radius:50%;
  background:rgba(255,250,246,.75);color:var(--ink);font-size:19px;
}
.topbar{
  flex:0 0 auto;height:48px;padding:0 14px;display:flex;align-items:center;gap:9px;
}
.day{
  font-size:12px;font-weight:700;color:var(--blue2);white-space:nowrap;
}
.mystery{
  min-width:0;flex:1;border:1px solid var(--line);border-radius:15px;
  background:rgba(255,250,246,.7);color:var(--ink);padding:8px 10px;
  font-size:12px;font-weight:600;
}
.progress-mini{
  min-width:55px;text-align:center;font-size:11px;font-weight:800;color:var(--blue2);
}
.stage-wrap{
  position:relative;flex:1;min-height:0;margin:0 6px 2px;
  overflow:hidden;border-radius:22px;
}
#stage{
  width:100%;height:100%;display:block;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
#scene{transform-origin:0 0}
.zoom{
  position:absolute;right:9px;top:9px;display:flex;flex-direction:column;
  gap:6px;z-index:10;
}
.zoom button{
  width:42px;height:42px;border:1px solid var(--line);border-radius:13px;
  background:rgba(255,250,246,.94);color:var(--ink);font-size:22px;
  box-shadow:0 2px 10px rgba(120,70,45,.08);
}
.zoom .reset{font-size:12px}
.hint{
  position:absolute;left:50%;bottom:5px;transform:translateX(-50%);
  font-size:9px;color:#b58d78;white-space:nowrap;pointer-events:none;
}
.controls{
  flex:0 0 auto;display:flex;gap:8px;padding:4px 12px 9px;
}
.action{
  height:46px;flex:1;border:1px solid var(--line);border-radius:15px;
  background:rgba(255,250,246,.78);color:var(--ink);font-size:13px;font-weight:800;
}
.action.primary{background:#f1dfd1}
.action:active{transform:scale(.98)}
.finish{
  display:none;flex:0 0 auto;text-align:center;padding:5px 10px;
  color:var(--gold);font-size:12px;font-weight:800;
}
.finish.show{display:block}

.bead-hit{fill:transparent;cursor:pointer}
.bead{stroke-width:2.5}
.small{fill:var(--bead);stroke:#874326}
.large{fill:url(#gold);stroke:#b56d27}
.done .bead{fill:url(#done);stroke:#4e8db7}
.current .bead{stroke:var(--blue2);stroke-width:5;filter:url(#glow)}
.bead-number{
  fill:#fffaf6;font-size:12px;font-weight:800;text-anchor:middle;
  dominant-baseline:middle;pointer-events:none
}
.large-number{fill:#fffaf6;font-size:14px;font-weight:800;text-anchor:middle;dominant-baseline:middle}
.mystery-title{
  fill:var(--ink);font-size:18px;font-family:Georgia,serif;
  font-weight:700;text-anchor:middle
}
.mystery-sub{
  fill:var(--blue2);font-size:12px;font-weight:700;text-anchor:middle
}
.small-label{
  fill:var(--blue2);font-size:14px;font-weight:700;text-anchor:middle
}
.arrow{fill:none;stroke:#e8cdbd;stroke-width:4;stroke-linecap:round;opacity:.85}
.tail-line{stroke:#b56d53;stroke-width:4;stroke-linecap:round;opacity:.75}
.cross{fill:var(--ink)}

@media(max-height:650px){
  header{height:48px}.brand{font-size:22px}.topbar{height:42px}
  .zoom button{width:38px;height:38px}.action{height:42px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">O Santo Rosário</div>
  <div class="header-actions">
    <button class="iconbtn" id="infoBtn" aria-label="Informações">ⓘ</button>
  </div>
</header>

<div class="topbar">
  <div class="day" id="day"></div>
  <select class="mystery" id="mystery"></select>
  <div class="progress-mini" id="progressText">0/59</div>
</div>

<div class="stage-wrap">
  <svg id="stage" viewBox="0 0 1000 1000" aria-label="Terço interativo">
    <defs>
      <radialGradient id="gold">
        <stop offset="0" stop-color="#f6d27b"/>
        <stop offset=".6" stop-color="#d99b2e"/>
        <stop offset="1" stop-color="#aa6228"/>
      </radialGradient>
      <linearGradient id="done" x1="0" y1="0" x2="0" y2="1">
        <stop stop-color="#b9ddf1"/><stop offset="1" stop-color="#639bc0"/>
      </linearGradient>
      <filter id="glow">
        <feGaussianBlur stdDeviation="4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <g id="scene">
      <!-- Oval principal -->
      <ellipse id="ovalGuide" cx="500" cy="480" rx="350" ry="400"
               fill="none" stroke="#e8cdbd" stroke-width="2.5"/>

      <!-- Pequenas setas discretas indicando o sentido -->
      <path class="arrow" d="M795 320 q30 55 8 108"/>
      <path class="arrow" d="M205 640 q-30 -55 -8 -108"/>

      <g id="labels"></g>
      <g id="beads"></g>
      <g id="tail"></g>
      <g id="cross"></g>
    </g>
  </svg>

  <div class="zoom">
    <button id="zoomIn" aria-label="Aumentar zoom">＋</button>
    <button id="zoomOut" aria-label="Diminuir zoom">−</button>
    <button id="zoomReset" class="reset" aria-label="Tamanho padrão">1×</button>
  </div>
  <div class="hint">Use dois dedos para ampliar • arraste quando ampliado</div>
</div>

<div class="finish" id="finish">🙏 Terço concluído — 59 contas marcadas</div>

<div class="controls">
  <button class="action" id="resetBtn">↶ Recomeçar</button>
  <button class="action primary" id="nextBtn">Próxima conta →</button>
</div>
</div>

<script>
'use strict';

const dayNames=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const mysteryNames=[
  "Mistérios Gozosos","Mistérios Dolorosos","Mistérios Dolorosos",
  "Mistérios Gloriosos","Mistérios Luminosos","Mistérios Dolorosos","Mistérios Gozosos"
];
const mysteryDays=["Dom/Sáb","Seg/Sáb","Ter/Sex","Qua/Dom","Qui","Ter/Sex","Seg/Sáb"];

const beads=[];
beads.push({type:"large",kind:"opening",label:"Pai-Nosso inicial"});
for(let i=1;i<=3;i++) beads.push({type:"small",kind:"opening",ave:i,label:`${i}ª Ave-Maria`});
for(let d=1;d<=5;d++){
  beads.push({type:"large",kind:"decade",decade:d,label:`Pai-Nosso — ${d}º Mistério`});
  for(let a=1;a<=10;a++) beads.push({type:"small",kind:"decade",decade:d,ave:a,label:`${a}ª Ave-Maria — ${d}º Mistério`});
}
if(beads.length!==59) throw new Error("Erro: o Terço deve possuir 59 contas.");

const key="meu_rosario_terco_v4";
let state=JSON.parse(localStorage.getItem(key)||"null");
if(!Array.isArray(state)||state.length!==59) state=Array(59).fill(false);

const mystery=document.getElementById("mystery");
mysteryNames.forEach((name,i)=>{
  const o=document.createElement("option");
  o.value=i;o.textContent=name+" • "+mysteryDays[i];mystery.appendChild(o);
});
mystery.value=new Date().getDay();

const svgNS="http://www.w3.org/2000/svg";
const beadsLayer=document.getElementById("beads");
const labelsLayer=document.getElementById("labels");
const tailLayer=document.getElementById("tail");
const crossLayer=document.getElementById("cross");

function el(name,attrs={}){
  const n=document.createElementNS(svgNS,name);
  for(const [k,v] of Object.entries(attrs)) n.setAttribute(k,v);
  return n;
}

/*
  ORDEM VISUAL:
  1 conta grande inicial
  3 Ave-Marias
  -> depois começa o 1º mistério
  -> 1 conta grande + 10 pequenas
  -> 2º mistério ...
  -> 5º mistério
  O primeiro mistério fica diretamente acima da sequência inicial.
*/
const loop=[];
const cx=500, cy=480, rx=350, ry=400;
const totalLoop=55;

/* A primeira conta grande da primeira dezena fica no ponto inferior do oval,
   exatamente depois das 3 Ave-Marias iniciais. */
for(let j=0;j<totalLoop;j++){
  const angle=(90 + j*(360/totalLoop))*Math.PI/180;
  loop.push({x:cx+rx*Math.cos(angle),y:cy+ry*Math.sin(angle),angle});
}

function buildScene(){
  beadsLayer.innerHTML="";labelsLayer.innerHTML="";
  tailLayer.innerHTML="";crossLayer.innerHTML="";

  /* Sequência inicial: cruz -> Pai-Nosso -> 3 Ave-Marias -> 1º mistério */
  const tailPoints=[
    {x:500,y:875,r:17,i:0},
    {x:500,y:824,r:11,i:1},
    {x:500,y:779,r:11,i:2},
    {x:500,y:734,r:11,i:3}
  ];

  tailLayer.appendChild(el("path",{
    d:"M500 935 L500 700",class:"tail-line",fill:"none"
  }));

  tailPoints.forEach(p=>{
    const g=el("g",{"class":"bead-group","data-i":p.i});
    const visible=el("circle",{cx:p.x,cy:p.y,r:p.r,class:"bead "+(p.i===0?"large":"small")});
    const hit=el("circle",{cx:p.x,cy:p.y,r:34,class:"bead-hit"});
    const num=el("text",{x:p.x,y:p.y,class:p.i===0?"large-number":"bead-number"});
    num.textContent=p.i===0?"":String(p.i);
    g.append(visible,hit,num);
    hit.addEventListener("pointerup",e=>{e.stopPropagation();toggle(p.i)});
    beadsLayer.appendChild(g);
  });

  /* Texto mínimo apenas para orientar as 3 Ave-Marias */
  const initialText=el("text",{x:620,y:805,class:"small-label"});
  initialText.textContent="3 Ave-Marias";
  labelsLayer.appendChild(initialText);

  /* 55 contas do oval */
  for(let j=0;j<55;j++){
    const i=4+j,p=loop[j],item=beads[i];
    const g=el("g",{"class":"bead-group","data-i":i});
    const r=item.type==="large"?18:12;
    const visible=el("circle",{cx:p.x,cy:p.y,r,class:"bead "+(item.type==="large"?"large":"small")});
    const hit=el("circle",{cx:p.x,cy:p.y,r:34,class:"bead-hit"});
    const num=el("text",{x:p.x,y:p.y,class:item.type==="large"?"large-number":"bead-number"});
    if(item.type==="large") num.textContent=item.decade;
    g.append(visible,hit,num);
    hit.addEventListener("pointerup",e=>{e.stopPropagation();toggle(i)});
    beadsLayer.appendChild(g);
  }

  /* Cinco títulos, apenas nos pontos das contas grandes */
  for(let d=1;d<=5;d++){
    const j=(d-1)*11,p=loop[j];
    const isBottom=p.y>cy;
    const y=p.y+(isBottom?55:-48);
    const title=el("text",{x:p.x,y,class:"mystery-title"});
    title.textContent=`${d}º mistério`;
    labelsLayer.appendChild(title);

    const sub=el("text",{x:p.x,y:y+(isBottom?18:-18),class:"mystery-sub"});
    sub.textContent="Pai-Nosso";
    labelsLayer.appendChild(sub);
  }

  /* Cruz simples, sem excesso de informação */
  const v=el("rect",{x:492,y:915,width:16,height:55,class:"cross"});
  const h=el("rect",{x:468,y:930,width:64,height:14,class:"cross"});
  crossLayer.append(v,h);
}

function save(){localStorage.setItem(key,JSON.stringify(state))}
function toggle(i){
  if(i<0||i>=59)return;
  state[i]=!state[i];save();render();
  if(navigator.vibrate) navigator.vibrate(10);
}
function nextPrayer(){
  const i=state.findIndex(v=>!v);
  if(i>=0){state[i]=true;save();render();}
}
function resetAll(){
  if(confirm("Recomeçar o Terço?")){
    state=Array(59).fill(false);save();render();
  }
}
function render(){
  const day=new Date().getDay();
  document.getElementById("day").textContent=dayNames[day];
  document.getElementById("progressText").textContent=`${state.filter(Boolean).length}/59`;
  document.getElementById("finish").classList.toggle("show",state.every(Boolean));

  document.querySelectorAll(".bead-group").forEach(g=>{
    const i=+g.dataset.i;
    g.classList.toggle("done",!!state[i]);
    g.classList.toggle("current",i===state.findIndex(v=>!v));
  });
}

document.getElementById("nextBtn").addEventListener("click",nextPrayer);
document.getElementById("resetBtn").addEventListener("click",resetAll);
mystery.addEventListener("change",render);
document.getElementById("infoBtn").addEventListener("click",()=>{
  alert("O Terço possui 59 contas físicas: 1 inicial, 3 Ave-Marias e 5 dezenas com 1 conta grande + 10 pequenas. As demais orações não criam contas extras.");
});

/* Zoom por botões + pinch-to-zoom com dois dedos + pan */
const stage=document.getElementById("stage");
const scene=document.getElementById("scene");
let scale=1,tx=0,ty=0;
let pointers=new Map();
let pinchStartDist=0,pinchStartScale=1;
let pinchStartMid=null,pinchStartTx=0,pinchStartTy=0;
let dragging=false,lastX=0,lastY=0;

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function applyTransform(){
  scene.setAttribute("transform",`translate(${tx} ${ty}) scale(${scale})`);
}
function setZoom(z){
  scale=clamp(z,.8,2.8);
  if(scale===1){tx=0;ty=0}
  applyTransform();
}
function resetZoom(){scale=1;tx=0;ty=0;applyTransform()}

document.getElementById("zoomIn").onclick=()=>setZoom(scale+.2);
document.getElementById("zoomOut").onclick=()=>setZoom(scale-.2);
document.getElementById("zoomReset").onclick=resetZoom;

stage.addEventListener("pointerdown",e=>{
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  stage.setPointerCapture(e.pointerId);

  if(pointers.size===1){
    dragging=true;lastX=e.clientX;lastY=e.clientY;
  }else if(pointers.size===2){
    const a=[...pointers.values()];
    pinchStartDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    pinchStartScale=scale;
    pinchStartMid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
    pinchStartTx=tx;pinchStartTy=ty;
    dragging=false;
  }
});

stage.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(pointers.size===2){
    const a=[...pointers.values()];
    const dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    const factor=dist/pinchStartDist;
    scale=clamp(pinchStartScale*factor,.8,2.8);

    const mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
    tx=pinchStartTx+(mid.x-pinchStartMid.x)*1.5;
    ty=pinchStartTy+(mid.y-pinchStartMid.y)*1.5;
    applyTransform();
  }else if(dragging && scale>1){
    const dx=e.clientX-lastX,dy=e.clientY-lastY;
    lastX=e.clientX;lastY=e.clientY;
    tx+=dx*1.7;ty+=dy*1.7;applyTransform();
  }
});

["pointerup","pointercancel","pointerleave"].forEach(type=>{
  stage.addEventListener(type,e=>{
    pointers.delete(e.pointerId);
    if(pointers.size===0)dragging=false;
  });
});

stage.addEventListener("wheel",e=>{
  e.preventDefault();
  setZoom(scale+(e.deltaY<0?.12:-.12));
},{passive:false});

buildScene();
render();
applyTransform();
</script>
</body>
</html>
